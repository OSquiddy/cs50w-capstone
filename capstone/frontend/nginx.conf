server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history-mode routing: unknown paths fall through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}