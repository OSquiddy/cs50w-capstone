# Render Blueprint — synced from Dashboard export (2026-08-09). Project/env names must match exactly.
# Env vars with sync: false keep their Dashboard values; do not hardcode secrets here.

version: "1"

projects:
  - name: Avicenna EHR System
    environments:
      - name: Production
        services:
          - type: web
            name: drf-backend
            runtime: python
            repo: https://github.com/OSquiddy/cs50w-capstone
            plan: free
            envVars:
              - key: CORS_ALLOWED_ORIGINS
                sync: false
              - key: PYTHON_VERSION
                sync: false
              - key: PORT
                sync: false
              - key: STATIC_ROOT_LOCATION
                sync: false
              - key: SECRET_KEY
                sync: false
              - key: PDF_ROOT_LOCATION
                sync: false
              - key: MEDIA_ROOT_LOCATION
                sync: false
              - key: DEBUG
                sync: false
              - key: DATABASE_URL
                fromDatabase:
                  name: capstone-db
                  property: connectionString
            region: oregon
            buildCommand: cd capstone/backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
            startCommand: cd capstone/backend && python manage.py seed_pdfs && python manage.py seed_media && gunicorn capstone.wsgi:application --bind 0.0.0.0:$PORT
            autoDeployTrigger: commit
            buildFilter:
              paths:
                - capstone/backend/**
                - capstone/frontend/public/**

          - type: web
            name: avicenna
            runtime: static
            repo: https://github.com/OSquiddy/cs50w-capstone
            buildCommand: npm ci && VUE_APP_API_URL=https://drf-backend-t3bv.onrender.com/api/v1 npm run build
            staticPublishPath: ./dist
            domains:
              - avicenna.osquiddy.com
              - avicenna.omarsiddiqui.dev
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            autoDeployTrigger: commit
            buildFilter:
              paths:
                - capstone/frontend/**
              ignoredPaths:
                - "**/*.md"
            rootDir: capstone/frontend

        databases:
          - name: capstone-db
            databaseName: capstone_db_74zv
            user: capstone_db_74zv_user
            plan: basic-256mb
            region: oregon
            ipAllowList:
              - source: 0.0.0.0/0
                description: everywhere
            postgresMajorVersion: "18"
            diskSizeGB: 1
